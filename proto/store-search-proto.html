<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>店舗検索プロトタイプ v2</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #0D1B2A;
    color: #1A1A1A;
  }
  :root {
    --red: #CC0000;
    --navy: #0D1B2A;
    --bg-gray: #F2F2F0;
    --text-primary: #1A1A1A;
    --border: #E0E0E0;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  section#search { background: var(--navy); padding: 60px 0 50px; }
  .section-title {
    text-align: center; color: #fff; font-size: 30px; font-weight: 700; margin: 0 0 8px;
  }
  .search-lead {
    text-align: center; color: rgba(255,255,255,0.65); font-size: 14px; margin: 0 0 28px;
  }

  /* ---- 探し方カード ---- */
  .locate-card {
    background: #fff; border-radius: 16px; padding: 28px 32px; max-width: 600px; margin: 0 auto 28px;
  }
  .locate-note { font-size: 13px; color: #666; text-align: center; margin: 0 0 18px; }
  .btn-geolocate {
    display: block; width: 100%; padding: 16px; background: var(--navy); color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer; letter-spacing: 0.02em;
  }
  .btn-geolocate:hover { opacity: 0.88; }
  .or-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: #999; font-size: 13px; }
  .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .zip-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .zip-mark { font-weight: 700; flex-shrink: 0; }
  .zip-row input[type="text"] {
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 16px; font-family: inherit; text-align: center; letter-spacing: 0.05em;
  }
  #zip1 { width: 5.5em; } #zip2 { width: 6.5em; }
  .zip-sep { color: #999; }
  .btn-zip-search {
    padding: 12px 22px; background: var(--red); color: #fff; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap;
  }

  /* ---- スクロール追従の絞り込みバー ---- */
  .sticky-filter-bar {
    position: sticky; top: 0; z-index: 20; background: var(--navy);
    padding-top: 10px; margin: 0 -20px; padding-left: 20px; padding-right: 20px;
  }
  .pref-tabs-row { display: flex; align-items: center; gap: 12px; }
  .btn-back-to-search {
    flex-shrink: 0; display: flex; align-items: center; gap: 4px;
    background: none; border: none; color: rgba(255,255,255,0.75); font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer; padding: 8px 2px; white-space: nowrap;
  }
  .btn-back-to-search:hover { color: #fff; }

  /* ---- 都道府県タブ ---- */
  .pref-tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 16px; flex: 1; min-width: 0;
    scrollbar-width: none;
  }
  .pref-tabs::-webkit-scrollbar { display: none; }
  .pref-tab {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.25);
    background: transparent; color: #fff; font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: all 0.15s;
  }
  .pref-tab .count {
    background: rgba(255,255,255,0.18); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700;
  }
  .pref-tab.active { background: var(--red); border-color: var(--red); }
  .pref-tab.active .count { background: rgba(255,255,255,0.28); }

  /* ---- 絞り込みアコーディオン ---- */
  .filter-accordion { background: #fff; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
  .filter-accordion-head {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 18px 24px;
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 16px; font-weight: 700; color: var(--text-primary); text-align: left;
  }
  .filter-accordion-head .chevron { margin-left: auto; color: #999; transition: transform 0.2s; font-size: 13px; }
  .filter-accordion.open .chevron { transform: rotate(180deg); }
  .filter-accordion-body {
    max-height: 0; overflow: hidden; transition: max-height 0.25s ease;
  }
  .filter-accordion.open .filter-accordion-body { max-height: 400px; }
  .filter-accordion-inner { padding: 4px 24px 24px; border-top: 1px solid var(--border); }
  .cond-row { margin: 18px 0; }
  .cond-label { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: block; }
  .cond-select {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit;
  }
  .cond-radio-group { display: flex; gap: 20px; flex-wrap: wrap; }
  .cond-radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .cond-panel-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-cond-clear {
    flex: 1; padding: 13px; background: #fff; color: #666; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .btn-cond-apply {
    flex: 2; padding: 13px; background: var(--red); color: #fff; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
  }

  /* ---- 画面下固定の「まとめバー」 ---- */
  .sticky-bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff;
    box-shadow: 0 -2px 14px rgba(0,0,0,0.14); padding: 14px 20px;
  }
  .sbb-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sbb-count { font-size: 13px; color: #333; white-space: nowrap; }
  .sbb-count b { color: var(--red); font-size: 19px; margin-right: 2px; }
  .sbb-divider { width: 1px; align-self: stretch; background: var(--border); flex-shrink: 0; }
  .sbb-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .sbb-filters-label { font-size: 12px; color: #999; flex-shrink: 0; }
  .sbb-chip {
    display: flex; align-items: center; gap: 6px; background: var(--bg-gray);
    color: #333; border: 1px solid var(--border); border-radius: 999px; padding: 5px 6px 5px 12px;
    font-size: 12px; white-space: nowrap;
  }
  .sbb-chip button {
    background: #ddd; border: none; color: #555; width: 16px; height: 16px; border-radius: 50%;
    cursor: pointer; font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .sbb-actions { display: flex; align-items: center; gap: 16px; margin-left: auto; flex-shrink: 0; }
  .btn-sbb-add {
    background: #fff; color: var(--red); border: 2px solid var(--red); border-radius: 999px;
    padding: 9px 18px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .btn-sbb-clear {
    background: none; border: none; color: #888; font-size: 12px; font-family: inherit;
    text-decoration: underline; cursor: pointer; white-space: nowrap;
  }

  /* ---- 店舗カード（2列グリッド） ---- */
  .store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 90px; }
  .store-card {
    background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .store-card.is-nearest { border: 2px solid var(--red); }
  .nearest-badge { font-size: 11px; font-weight: 700; color: var(--red); }
  .store-card-name { font-size: 16px; font-weight: 700; margin: 0; }
  .store-card-dist { font-size: 12px; font-weight: 700; color: var(--red); margin-left: 6px; }
  .store-card-addr { font-size: 12px; color: #666; margin: -4px 0 0; }
  .store-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .store-tag-product { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 4px; background: #EAF2FB; color: #1A5276; }
  .store-tag-lens { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 4px; background: #EAFAF1; color: #1E8449; }
  .store-model-detail { display: flex; flex-direction: column; gap: 6px; }
  .store-model-row { font-size: 12px; color: #1A1A1A; line-height: 1.4; }
  .store-model-label { display: block; font-size: 10px; font-weight: 700; color: var(--navy); margin-bottom: 1px; }
  .store-model-value { display: block; }
  .store-card-actions { display: flex; gap: 8px; margin-top: 2px; }
  .btn-store-web, .btn-store-tel {
    flex: 1; text-align: center; padding: 9px 8px; font-size: 12px; font-weight: 700;
    font-family: inherit; border-radius: 6px; text-decoration: none; white-space: nowrap;
  }
  .btn-store-web { background: var(--red); color: #fff; }
  .btn-store-tel { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
  .empty-msg { color: #fff; text-align: center; padding: 40px 0; opacity: 0.7; grid-column: 1 / -1; }

  @media (max-width: 767px) {
    .store-grid { grid-template-columns: 1fr; }
    .zip-row { flex-wrap: wrap; }
    .btn-zip-search { width: 100%; }
    .cond-radio-group { gap: 14px; }
  }
</style>
</head>
<body>

<section id="search">
  <div class="container">
    <h2 class="section-title">お近くの店舗を探す</h2>
    <p class="search-lead">現在地、または郵便番号(上3桁)でお近くの店舗を絞り込めます</p>

    <div class="locate-card" id="locate-card">
      <p class="locate-note">現在地からの検索は本番サーバーでのみ動作します（プロトタイプでは無効）</p>
      <button class="btn-geolocate" onclick="fakeGeolocate()">📍 現在地から探す</button>
      <div class="or-divider"><span>または</span></div>
      <div class="zip-row">
        <span class="zip-mark">〒</span>
        <input type="text" id="zip1" maxlength="3" placeholder="330">
        <span class="zip-sep">-</span>
        <input type="text" id="zip2" maxlength="4" placeholder="0846">
        <button class="btn-zip-search" onclick="fakeZipSearch()">検索</button>
      </div>
    </div>

    <div class="sticky-filter-bar">
      <div class="pref-tabs-row">
        <div class="pref-tabs" id="pref-tabs"></div>
        <button class="btn-back-to-search" onclick="scrollToSearch()">▲ 検索へ戻る</button>
      </div>

      <div class="filter-accordion" id="filter-accordion">
        <button class="filter-accordion-head" onclick="toggleAccordion()">
          取扱商品・ご希望内容で絞り込む
          <span class="chevron">▼</span>
        </button>
        <div class="filter-accordion-body">
          <div class="filter-accordion-inner">
            <div class="cond-row">
              <label class="cond-label">商品を選ぶ</label>
              <select class="cond-select" id="cond-product">
                <option value="">指定しない</option>
                <option value="MIRZA">MiRZA</option>
                <option value="Rokid">Rokid</option>
                <option value="Even Realities">Even Realities</option>
                <option value="Viture">VITURE Luma シリーズ</option>
                <option value="SABERA">SABERA</option>
              </select>
            </div>
            <div class="cond-row">
              <label class="cond-label">ご希望の内容</label>
              <div class="cond-radio-group">
                <label><input type="radio" name="cond-purpose" value=""> 指定しない</label>
                <label><input type="radio" name="cond-purpose" value="trial"> 本体購入・試着</label>
                <label><input type="radio" name="cond-purpose" value="lens"> レンズ交換</label>
              </div>
            </div>
            <div class="cond-panel-actions">
              <button class="btn-cond-clear" onclick="clearCond()">条件をクリア</button>
              <button class="btn-cond-apply" onclick="applyCond()">この条件で絞り込む</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="store-grid" id="store-grid"></div>
  </div>
</section>

<div class="sticky-bottom-bar">
  <div class="sbb-inner">
    <div class="sbb-count" id="sbb-count"></div>
    <div class="sbb-divider" id="sbb-divider" style="display:none"></div>
    <div class="sbb-filters" id="sbb-filters"></div>
    <div class="sbb-actions">
      <button class="btn-sbb-clear" id="btn-sbb-clear" onclick="clearAllFilters()" style="display:none">すべて解除</button>
      <button class="btn-sbb-add" onclick="jumpToAccordion()">条件を追加</button>
    </div>
  </div>
</div>

<script>
  const STORES = [
    { name: 'アイメガネ本店', pref: '埼玉県', lat: 35.902, lon: 139.623 },
    { name: 'アイメガネ与野イオン店', pref: '埼玉県', lat: 35.896, lon: 139.625 },
    { name: 'アイメガネ与野本町店', pref: '埼玉県', lat: 35.894, lon: 139.622 },
    { name: 'アイメガネ南浦和店', pref: '埼玉県', lat: 35.847, lon: 139.656 },
    { name: 'アイメガネ岩槻駅前通り店', pref: '埼玉県', lat: 35.951, lon: 139.706 },
    { name: 'アイメガネ上尾東口駅前店', pref: '埼玉県', lat: 35.977, lon: 139.593 },
    { name: 'アイメガネ鴻巣東駅通り店', pref: '埼玉県', lat: 36.067, lon: 139.489 },
    { name: 'アイメガネ鴻巣ウニクス店', pref: '埼玉県', lat: 36.058, lon: 139.503 },
    { name: 'アイメガネ熊谷ティアラ店', pref: '埼玉県', lat: 36.147, lon: 139.389 },
    { name: 'アイメガネ深谷上柴西店', pref: '埼玉県', lat: 36.196, lon: 139.281 },
    { name: 'アイメガネ富士見鶴馬店', pref: '埼玉県', lat: 35.858, lon: 139.550 },
    { name: 'アイメガネ川越的場店', pref: '埼玉県', lat: 35.925, lon: 139.486 },
    { name: 'アイメガネ坂戸にっさい店', pref: '埼玉県', lat: 35.957, lon: 139.401 },
    { name: 'アイメガネ東松山松本町店', pref: '埼玉県', lat: 36.043, lon: 139.399 },
    { name: 'アイメガネ嵐山バイパス店', pref: '埼玉県', lat: 36.059, lon: 139.325 },
    { name: 'アイメガネ小川大塚店', pref: '埼玉県', lat: 36.055, lon: 139.263 },
    { name: 'アイメガネ寄居店', pref: '埼玉県', lat: 36.115, lon: 139.183 },
    { name: 'アイメガネ日高店', pref: '埼玉県', lat: 35.905, lon: 139.340 },
    { name: 'アイメガネイオンタウン毛呂山店', pref: '埼玉県', lat: 35.928, lon: 139.319 },
    { name: 'アイメガネ秩父中宮地店', pref: '埼玉県', lat: 35.993, lon: 139.086 },
    { name: 'アイメガネ川口赤井店', pref: '埼玉県', lat: 35.807, lon: 139.724 },
    { name: 'アイメガネエキア谷塚店', pref: '埼玉県', lat: 35.822, lon: 139.801 },
    { name: 'アイメガネ三郷南口駅前通り店', pref: '埼玉県', lat: 35.832, lon: 139.871 },
    { name: 'アイメガネ新越谷店', pref: '埼玉県', lat: 35.888, lon: 139.791 },
    { name: 'アイメガネ蓮田関山店', pref: '埼玉県', lat: 35.985, lon: 139.663 },
    { name: 'アイメガネ幸手エムズタウン店', pref: '埼玉県', lat: 36.082, lon: 139.725 },
    { name: 'アイメガネ羽生店', pref: '埼玉県', lat: 36.174, lon: 139.548 },
    { name: 'アイメガネ古河イオン店', pref: '茨城県', lat: 36.193, lon: 139.706 },
    { name: 'アイメガネおもちゃのまち西口店', pref: '栃木県', lat: 36.376, lon: 139.810 },
    { name: 'アイメガネ宇都宮錦店', pref: '栃木県', lat: 36.558, lon: 139.883 },
    { name: 'アイメガネ今市センショープラザ店', pref: '栃木県', lat: 36.720, lon: 139.699 },
    { name: 'アイメガネ藤岡店', pref: '群馬県', lat: 36.255, lon: 139.074 },
    { name: 'アイメガネ小平小川町店', pref: '東京都', lat: 35.728, lon: 139.477 },
    { name: 'アイメガネザ・マーケットプレイス東大和店', pref: '東京都', lat: 35.740, lon: 139.428 },
    { name: 'アイメガネ町田木曽店', pref: '東京都', lat: 35.540, lon: 139.441 },
    { name: 'アイメガネ八千代台ユアエルム店', pref: '千葉県', lat: 35.723, lon: 140.102 },
    { name: 'アイメガネ焼津石津店', pref: '静岡県', lat: 34.865, lon: 138.323 },
  ].map(s => Object.assign(s, { url: '#', reserve: '#', tel: '048-000-0000', address: s.pref + '〇〇市〇〇1-2-3' }));

  const SPECIAL_BRANDS = {
    'アイメガネ南浦和店': { MIRZA:{body:true,lens:true}, Rokid:{body:false,lens:true}, 'Even Realities':{body:true,lens:true}, VITURE:{body:true,lens:true}, Viture:{body:true,lens:true}, SABERA:{body:true,lens:true} },
    'アイメガネ宇都宮錦店': { MIRZA:{body:false,lens:true}, Rokid:{body:false,lens:true}, 'Even Realities':{body:true,lens:true}, VITURE:{body:false,lens:false}, Viture:{body:false,lens:false}, SABERA:{body:true,lens:true} },
    'アイメガネ八千代台ユアエルム店': { MIRZA:{body:false,lens:true}, Rokid:{body:false,lens:true}, 'Even Realities':{body:true,lens:true}, VITURE:{body:false,lens:false}, Viture:{body:false,lens:false}, SABERA:{body:true,lens:true} },
  };
  const DEFAULT_BRANDS = { MIRZA:{body:false,lens:true}, Rokid:{body:false,lens:true}, 'Even Realities':{body:false,lens:false}, VITURE:{body:false,lens:false}, Viture:{body:false,lens:false}, SABERA:{body:false,lens:true} };
  const BRAND_KEYS = ['MIRZA', 'Rokid', 'Even Realities', 'VITURE', 'SABERA'];

  function getStoreCaps(store) { return SPECIAL_BRANDS[store.name] || DEFAULT_BRANDS; }

  const BRAND_DISPLAY = { MIRZA: 'MiRZA', Rokid: 'Rokid', 'Even Realities': 'Even Realities G2', VITURE: 'VITURE', SABERA: 'SABERA' };

  function buildStoreModelDetail(store, brand) {
    const caps = getStoreCaps(store);
    let bodyBrands = [], lensBrands = [];
    function classify(b, c) {
      if (!c) return;
      const name = BRAND_DISPLAY[b] || b;
      if (c.body) bodyBrands.push(name);
      if (c.lens) lensBrands.push(name);
    }
    if (brand) {
      const c = caps[brand] || caps[brand === 'VITURE' ? 'Viture' : brand];
      classify(brand, c);
    } else {
      BRAND_KEYS.forEach(b => classify(b, caps[b]));
    }
    let html = '<div class="store-model-detail">';
    if (bodyBrands.length) html += `<p class="store-model-row"><span class="store-model-label">本体取扱</span><span class="store-model-value">${bodyBrands.join('・')}</span></p>`;
    if (lensBrands.length) html += `<p class="store-model-row"><span class="store-model-label">レンズ交換</span><span class="store-model-value">${lensBrands.join('・')}</span></p>`;
    html += '</div>';
    return html;
  }

  function storeMatches(store, brand, purpose) {
    const caps = getStoreCaps(store);
    if (brand) {
      const cap = caps[brand];
      if (!cap) return false;
      if (purpose === 'trial') return cap.body;
      if (purpose === 'lens') return cap.lens;
      return cap.body || cap.lens;
    }
    if (purpose === 'trial') return Object.values(caps).some(c => c.body);
    if (purpose === 'lens') return Object.values(caps).some(c => c.lens);
    return true;
  }

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  const state = { pref: 'すべて', brand: '', purpose: '', originLabel: null, originLat: null, originLon: null };
  const PREF_ORDER = ['すべて', '埼玉県', '東京都', '栃木県', '千葉県', '茨城県', '群馬県', '静岡県'];

  function renderPrefTabs() {
    const wrap = document.getElementById('pref-tabs');
    const baseFiltered = STORES.filter(s => storeMatches(s, state.brand, state.purpose));
    wrap.innerHTML = PREF_ORDER.map(p => {
      const count = p === 'すべて' ? baseFiltered.length : baseFiltered.filter(s => s.pref === p).length;
      if (count === 0 && p !== 'すべて') return '';
      return `<button class="pref-tab${state.pref===p?' active':''}" onclick="setPref('${p}')">${p}<span class="count">${count}</span></button>`;
    }).join('');
  }

  function renderChips() {
    const wrap = document.getElementById('sbb-filters');
    let chips = '';
    if (state.brand) {
      const label = state.brand === 'Viture' ? 'VITURE' : state.brand;
      chips += `<span class="sbb-chip">${label}<button onclick="clearBrand()">×</button></span>`;
    }
    if (state.purpose) {
      chips += `<span class="sbb-chip">${state.purpose==='trial'?'本体購入・試着':'レンズ交換'}<button onclick="clearPurpose()">×</button></span>`;
    }
    if (state.originLabel) {
      chips += `<span class="sbb-chip">${state.originLabel}から近い順<button onclick="clearOrigin()">×</button></span>`;
    }
    wrap.innerHTML = chips || '<span class="sbb-filters-label">絞り込み条件なし</span>';
    const hasFilter = !!(state.brand || state.purpose || state.originLabel);
    document.getElementById('btn-sbb-clear').style.display = hasFilter ? '' : 'none';
    document.getElementById('sbb-divider').style.display = hasFilter ? '' : 'none';
  }

  function renderList() {
    let list = STORES.filter(s => storeMatches(s, state.brand, state.purpose) && (state.pref === 'すべて' || s.pref === state.pref));
    const gridEl = document.getElementById('store-grid');

    if (state.originLabel) {
      list = list.map(s => Object.assign({}, s, { dist: haversine(state.originLat, state.originLon, s.lat, s.lon) }))
                 .sort((a,b) => a.dist - b.dist);
    }

    if (list.length === 0) {
      gridEl.innerHTML = '<p class="empty-msg">条件に合う店舗が見つかりませんでした。条件を変えてお試しください。</p>';
    } else {
      gridEl.innerHTML = list.map((s, i) => `
        <div class="store-card${(state.originLabel && i===0) ? ' is-nearest' : ''}">
          ${(state.originLabel && i===0) ? '<span class="nearest-badge">お客様に最も近い店舗</span>' : ''}
          <p class="store-card-name">${s.name}${s.dist!=null ? `<span class="store-card-dist">約 ${s.dist.toFixed(1)} km</span>` : ''}</p>
          <p class="store-card-addr">${s.address}</p>
          ${buildStoreModelDetail(s, state.brand)}
          <div class="store-card-actions">
            <a href="${s.reserve}" class="btn-store-web">WEB予約</a>
            <a href="tel:${s.tel}" class="btn-store-tel">${s.tel}</a>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('sbb-count').innerHTML = `<b>${list.length}</b>店舗該当 / 全${STORES.length}店舗`;
  }

  function renderAll() { renderPrefTabs(); renderChips(); renderList(); }

  function setPref(p) { state.pref = p; renderAll(); }
  function clearBrand() { state.brand = ''; document.getElementById('cond-product').value=''; renderAll(); }
  function clearPurpose() { state.purpose = ''; document.querySelectorAll('input[name="cond-purpose"]').forEach(r=>r.checked=(r.value==='')); renderAll(); }
  function clearOrigin() { state.originLabel = null; renderAll(); }

  function scrollToSearch() {
    document.getElementById('locate-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function jumpToAccordion() {
    const acc = document.getElementById('filter-accordion');
    acc.classList.add('open');
    acc.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function clearAllFilters() {
    state.brand = ''; state.purpose = ''; state.originLabel = null; state.pref = 'すべて';
    document.getElementById('cond-product').value = '';
    document.querySelectorAll('input[name="cond-purpose"]').forEach(r => r.checked = (r.value===''));
    renderAll();
  }

  function toggleAccordion() {
    document.getElementById('filter-accordion').classList.toggle('open');
  }
  function clearCond() {
    document.getElementById('cond-product').value = '';
    document.querySelectorAll('input[name="cond-purpose"]').forEach(r => r.checked = (r.value===''));
    state.brand = ''; state.purpose = '';
    renderAll();
  }
  function applyCond() {
    state.brand = document.getElementById('cond-product').value;
    state.purpose = (document.querySelector('input[name="cond-purpose"]:checked')||{}).value || '';
    document.getElementById('filter-accordion').classList.remove('open');
    renderAll();
  }

  function fakeGeolocate() {
    state.originLabel = '現在地';
    state.originLat = 35.90; state.originLon = 139.62;
    renderAll();
  }
  function fakeZipSearch() {
    const z1 = document.getElementById('zip1').value, z2 = document.getElementById('zip2').value;
    if (!z1 || !z2) return;
    state.originLabel = `〒${z1}-${z2}`;
    state.originLat = 35.90; state.originLon = 139.62;
    renderAll();
  }

  renderAll();
</script>

</body>
</html>
